schema: mapping.dataset-to-sdt
schemaVersion: 1
techId: Lenovo.DE
displayName: Lenovo DE dataset-to-SDT mapping v1
compatibility:
  contracts:
    version: 2.0.0
  coreValidation: strict
strictContracts:
  enabled: true
  requireAllMappings: false
  forbidUnmappedDatasets: false
  requireSelectors: false
syncPolicy:
  collectorSkeletonMapping:
    allowedRenderAs:
    - table
    selectors:
      defaultByRenderAs:
        table:
        - items
    unsupportedRenderShape:
      documentFacing: fail
      nonDocumentFacing: skip
collectorSdtTagPolicy:
  required: true
  tokenRewrites:
    '[<SystemId>]': '[ArrayName]'
  tagAliases:
    LNV.Lenovo.DE.System[ArrayName].Tables.Drives: LNV.Lenovo.DE.Drive[DriveID].Tables.Inventory
    LNV.Lenovo.DE.System[ArrayName].Tables.StorageContainers: LNV.Lenovo.DE.Pool[PoolName].Tables.Inventory
    LNV.Lenovo.DE.System[ArrayName].Tables.Volumes: LNV.Lenovo.DE.Volume[VolumeName].Tables.Inventory
    LNV.Lenovo.DE.System[ArrayName].Tables.ASUP: LNV.Lenovo.DE.System[ArrayName].Tables.AutoSupport
mappings:
- dataset: systems
  sdtTag: LNV.Lenovo.DE.System[<SystemId>].Summary
  required: true
  notes: placement=Main; minInfoLevel=1; objectKey=System; scope=PerSystem
- dataset: system-controllers
  sdtTag: LNV.Lenovo.DE.System[<SystemId>].Tables.Controllers
  required: true
  notes: placement=Main; minInfoLevel=1; objectKey=Controllers; scope=PerSystem
  renderHint:
