    - policies
    - alerts
    - tasks
    - cvms
    - hosts
    - host_nics
    - networks
    - virtual_switches
    - storage_containers
    - datastores
    - storage_pools
    - disks
    - volume_groups
    - protection_domains
    - remote_sites
    - images
    - templates
    - health_checks
    - alerts_configuration
    - smtp_config
    - snmp
    - authconfig
    - ssl_certificates
    - nfs_whitelist
    - witness
    - snapshots
    - virtual_disks
    - pd_replications
    - dr_snapshots
    - unprotected_vms
    - vm_nics
    - license
    - collection_sources
    - relationships
