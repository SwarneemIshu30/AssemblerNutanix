name: Canonical Direct V1 CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - cdxwl/canonical-direct-v1-composition

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell YAML parser
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Run isolated Pester suites
        shell: pwsh
        run: |
          $total = 0
          $passed = 0
          $failed = 0
          foreach ($file in @(Get-ChildItem ./tests -Filter '*.Tests.ps1' -File | Sort-Object Name)) {
            Write-Host "::group::$($file.Name)"
            $resultJson = & pwsh -NoLogo -NoProfile -Command @"
          `$result = Invoke-Pester -Path '$($file.FullName.Replace("'", "''"))' -PassThru -Output Detailed
          [ordered]@{ Total = `$result.TotalCount; Passed = `$result.PassedCount; Failed = `$result.FailedCount } | ConvertTo-Json -Compress
          if (`$result.FailedCount -gt 0) { exit 1 }
          "@
            $resultJson | ForEach-Object { Write-Host $_ }
            $result = $resultJson | Select-Object -Last 1 | ConvertFrom-Json
            $total += $result.Total
            $passed += $result.Passed
            $failed += $result.Failed
            Write-Host "::endgroup::"
          }
          Write-Host "Pester total=$total passed=$passed failed=$failed"
          if ($failed -gt 0) { throw "$failed Pester tests failed." }

      - name: Build and validate package
        shell: pwsh
        run: |
          ./scripts/New-AssemblerPackage.ps1 -OutputDir dist -BuildChannel ci -PackageVersion "0.0.0-ci.${{ github.run_number }}"
          $manifest = Get-Content ./dist/package.manifest.json -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $manifest.zipPath -PathType Leaf)) {
            throw "Package was not created: $($manifest.zipPath)"
          }

      - name: Canonical DE runtime smoke
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'assembler-de-smoke'
          $json = & pwsh -NoLogo -NoProfile -File ./scripts/Invoke-AssemblerBundleRender.ps1 `
            -BundleRoot ./tests/fixtures/canonical-de `
            -CatalogPath ./templates/skeletons/Lenovo.DE/DE-SDT-Dummy.catalog.json `
            -ContractsRoot ./.deps/contracts `
            -OutputRoot $output
          $report = $json | ConvertFrom-Json
          if ([string]$report.status -eq 'ERROR') {
            throw "Canonical DE runtime smoke failed with ERROR report status. Output: $json"
          }
          $outputPath = [string]$report.outputPath
          if ([string]::IsNullOrWhiteSpace($outputPath) -and @($report.runs).Count -gt 0) {
            $outputPath = [string]@($report.runs)[0].outputPath
          }
          if ([string]::IsNullOrWhiteSpace($outputPath) -and @($report.runs).Count -gt 0 -and @(@($report.runs)[0].variants).Count -gt 0) {
            $outputPath = [string]@(@($report.runs)[0].variants)[0].outputPath
          }
          if ([string]::IsNullOrWhiteSpace($outputPath) -or -not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw "Canonical DE runtime smoke did not produce the reported output file. Output: $json"
          }
